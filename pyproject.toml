[project]
name = "ai-shopping-assistant-scraper"
version = "0.1.0"
description = "Production-grade distributed web scraping platform for an AI Shopping Copilot"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "AI Infrastructure Team", email = "engineering@aishoppingcopilot.com" }
]

dependencies = [
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "typer>=0.12.3",
    "structlog>=24.1.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "prometheus-client>=0.20.0",
    "alembic>=1.13.1",
    "croniter>=2.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
    "types-pyyaml>=6.0.12.20240311",
    "types-croniter>=2.0.0.20240423",
]

[project.scripts]
scraper-cli = "src.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PL", "RUF"]
ignore = [
    "PLR0912",
    "PLR0913",
    "UP046",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"


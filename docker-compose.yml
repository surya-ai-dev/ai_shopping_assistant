version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: scraper_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scraper_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scraper_password}
      POSTGRES_DB: ${POSTGRES_DB:-scraper_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scraper_user} -d ${POSTGRES_DB:-scraper_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  scraper_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scraper_runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-scraper_user}:${POSTGRES_PASSWORD:-scraper_password}@postgres:5432/${POSTGRES_DB:-scraper_db}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BROWSER_HEADLESS=${BROWSER_HEADLESS:-true}
      - PROMETHEUS_METRICS_PORT=${PROMETHEUS_METRICS_PORT:-8000}
    ports:
      - "8000:8000"
    command: ["worker", "start"]

volumes:
  postgres_data:
    driver: local
